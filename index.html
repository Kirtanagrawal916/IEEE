<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HerEarn | Skill to Income Platform for Women</title>
  <meta name="description" content="Turn Skills Into Sustainable Income. Empowering women across India to learn market-relevant skills, showcase their work, and connect with real income opportunities.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            purpleBrand: {
              500: '#8b5cf6',
              600: '#7C3AED',
              700: '#6d28d9',
            },
            pinkBrand: {
              500: '#ec4899',
              600: '#EC4899',
            }
          },
          fontFamily: {
            sans: ['Outfit', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="light bg-purple-50/50 dark:bg-[#0a0518] text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-300">
  <div id="root"></div>
  <!-- Google Identity Services (OAuth 2.0 Sign-In) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Google Translate Engine for Full Page Translation across every page -->
  <div id="google_translate_element" style="display:none;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,mr,bn,ta,te,gu,kn,ml,pa',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
