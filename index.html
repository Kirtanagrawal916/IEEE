                    </div>
                    <div>
                      <p className="text-3xl font-extrabold text-purple-400">650+</p>
                      <p className="text-xs font-semibold text-slate-400 uppercase mt-1">Partner Businesses</p>
                    </div>
                    <div>
                      <p className="text-3xl font-extrabold text-rose-400">₹6,500/mo</p>
                      <p className="text-xs font-semibold text-slate-400 uppercase mt-1">Avg First Gig Stipend</p>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {/* TAB: LEARN SKILLS */}
            {activeTab === 'learn' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                {/* Track Header */}
                <div className="glass-card rounded-3xl p-6 md:p-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                  <div className="space-y-2">
                    <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-semibold">
                      Skill Learning Hub
                    </span>
                    <h1 className="text-2xl sm:text-3xl font-bold text-white">{currentTrack.title}</h1>
                    <p className="text-xs sm:text-sm text-slate-300 max-w-xl">{currentTrack.description}</p>
                  </div>

                  <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 w-full md:w-72 space-y-2">
                    <div className="flex items-center justify-between text-xs font-bold">
                      <span className="text-slate-300">Track Progress</span>
                      <span className="text-indigo-400">{progressPercent}%</span>
                    </div>
                    <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                      <div className="h-full bg-gradient-to-r from-indigo-500 to-rose-500 transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
                    </div>
                    <p className="text-[11px] text-slate-400">{completedCount} of {currentTrack.lessons.length} Lessons Done</p>
                  </div>
                </div>

                {/* Player & Playlist Grid */}
                <div className="grid lg:grid-cols-12 gap-8">
                  <div className="lg:col-span-8 space-y-6">
                    <div className="bg-black rounded-3xl overflow-hidden aspect-video border border-slate-800 shadow-2xl">
                      <iframe src={activeLesson.videoUrl} title={activeLesson.title} className="w-full h-full border-0" allowFullScreen></iframe>
                    </div>

                    <div className="glass-card rounded-2xl p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                        <div>
                          <span className="text-xs font-bold text-indigo-400 uppercase">{currentTrack.category} • {activeLesson.duration}</span>
                          <h2 className="text-xl font-bold text-white mt-1">{activeLesson.title}</h2>
                        </div>
                        <button 
                          onClick={() => handleToggleLesson(activeLesson.id)}
                          className={`px-5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 ${
                            user.completedLessons.includes(activeLesson.id)
                              ? 'bg-emerald-600 text-white'
                              : 'btn-gradient-primary text-white'
                          }`}
                        >
                          <i data-lucide="check-circle" className="w-4 h-4"></i>
                          {user.completedLessons.includes(activeLesson.id) ? 'Completed!' : 'Mark Complete'}
                        </button>
                      </div>

                      <p className="text-xs text-slate-300 leading-relaxed">{activeLesson.summary}</p>
                    </div>

                    {progressPercent >= 60 && (
                      <div className="bg-gradient-to-r from-purple-900 to-slate-900 border border-purple-500/40 rounded-2xl p-6 text-white space-y-3 shadow-xl">
                        <span className="text-xs font-bold text-amber-400 uppercase tracking-widest">🎉 Portfolio Ready!</span>
                        <h3 className="text-xl font-bold">Submit Your Capstone Project to Unlock Client Gigs</h3>
                        <p className="text-xs text-slate-300">You've mastered enough lessons. Publish your graphic or strategy project to your public portfolio to apply for paid work.</p>
                        <button onClick={() => { setActiveTab('portfolio'); setIsSubmitOpen(true); }} className="btn-gradient-primary px-5 py-2.5 rounded-xl font-bold text-xs text-white">
                          Go to Portfolio & Submit
                        </button>
                      </div>
                    )}
                  </div>

                  {/* Right Playlist */}
                  <div className="lg:col-span-4 space-y-6">
                    <div className="glass-card rounded-2xl p-5 space-y-3">
                      <h3 className="text-xs font-bold text-slate-400 uppercase">Select Track</h3>
                      <div className="space-y-2">
                        {skillTracksData.map(t => (
                          <button
                            key={t.id}
                            onClick={() => { setSelectedTrackId(t.id); setActiveLessonId(t.lessons[0].id); }}
                            className={`w-full text-left p-3 rounded-xl border text-xs font-bold transition-all flex items-center justify-between ${
                              selectedTrackId === t.id ? 'bg-indigo-600/20 border-indigo-500 text-white' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                            }`}
                          >
                            <span>{t.title}</span>
                            <span className="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-indigo-300">{t.duration}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="glass-card rounded-2xl p-5 space-y-3">
                      <h3 className="text-xs font-bold text-slate-400 uppercase">Lesson List ({completedCount}/{currentTrack.lessons.length})</h3>
                      <div className="space-y-2">
                        {currentTrack.lessons.map((l, idx) => {
                          const isDone = user.completedLessons.includes(l.id);
                          const isActive = activeLessonId === l.id;
                          return (
                            <div
                              key={l.id}
                              onClick={() => setActiveLessonId(l.id)}
                              className={`p-3 rounded-xl border cursor-pointer text-xs font-semibold flex items-center justify-between transition-all ${
                                isActive ? 'bg-indigo-600 text-white border-indigo-500' : isDone ? 'bg-emerald-950/40 border-emerald-800/60 text-slate-300' : 'bg-slate-900 border-slate-800 text-slate-400'
                              }`}
                            >
                              <div className="flex items-center gap-3">
                                <span className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold ${isDone ? 'bg-emerald-500 text-white' : 'bg-slate-800'}`}>
                                  {isDone ? '✓' : idx + 1}
                                </span>
                                <span className="line-clamp-1">{l.title}</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: PORTFOLIO SHOWCASE */}
            {activeTab === 'portfolio' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                <div className="glass-card rounded-3xl p-6 md:p-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                  <div>
                    <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 text-xs font-semibold">Verified Skill Showcase</span>
                    <h1 className="text-2xl sm:text-3xl font-bold text-white mt-1">Learner Portfolio Gallery</h1>
                    <p className="text-xs sm:text-sm text-slate-300 max-w-xl">Real projects built by women completing our skill tracks. Vetted clients review these to offer paid work.</p>
                  </div>
                  <button onClick={() => setIsSubmitOpen(true)} className="btn-gradient-primary px-6 py-3 rounded-xl font-bold text-xs text-white">
                    + Submit New Project
                  </button>
                </div>

                <div className="grid md:grid-cols-3 gap-8">
                  {portfolios.map(p => (
                    <div key={p.id} className="glass-card rounded-2xl overflow-hidden card-hover-effect flex flex-col justify-between">
                      <div>
                        <img src={p.imageUrl} alt={p.title} className="w-full h-48 object-cover" />
                        <div className="p-6 space-y-3">
                          <div className="flex items-center gap-3">
                            <img src={p.authorAvatar} alt={p.authorName} className="w-9 h-9 rounded-full border border-indigo-400" />
                            <div>
                              <p className="text-xs font-bold text-white">{p.authorName}</p>
                              <p className="text-[10px] text-slate-400">{p.location} • {p.category}</p>
                            </div>
                          </div>
                          <h3 className="text-sm font-bold text-white line-clamp-2">{p.title}</h3>
                          <p className="text-xs text-slate-300 line-clamp-3 leading-relaxed">{p.description}</p>
                          <div className="flex flex-wrap gap-1">
                            {p.tags.map((t, idx) => (
                              <span key={idx} className="bg-indigo-500/20 text-indigo-300 text-[10px] px-2 py-0.5 rounded">#{t}</span>
                            ))}
                          </div>
                        </div>
                      </div>
                      <div className="px-6 py-4 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between">
                        <span>❤️ {p.likes} Likes</span>
                        <span className="text-emerald-400 font-bold">✓ Verified Skill</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: OPPORTUNITY BOARD */}
            {activeTab === 'gigs' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                <div className="glass-card rounded-3xl p-6 md:p-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                  <div>
                    <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 text-xs font-semibold">Verified Paid Work</span>
                    <h1 className="text-2xl sm:text-3xl font-bold text-white mt-1">Micro-Gigs & Remote Internships</h1>
                    <p className="text-xs sm:text-sm text-slate-300 max-w-xl">Apply with 1-click using your verified portfolio. Payment is held in secure escrow.</p>
                  </div>
                </div>

                <div className="grid md:grid-cols-2 gap-6">
                  {gigs.map(g => (
                    <div key={g.id} className="glass-card rounded-2xl p-6 space-y-4 flex flex-col justify-between">
                      <div className="space-y-3">
                        <div className="flex items-start justify-between">
                          <div className="flex items-center gap-3">
                            <img src={g.logo} alt={g.company} className="w-12 h-12 rounded-xl object-cover border border-slate-700" />
                            <div>
                              <h3 className="text-base font-bold text-white">{g.title}</h3>
                              <p className="text-xs text-slate-400">{g.company}</p>
                            </div>
                          </div>
                          <span className="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30">{g.stipend}</span>
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">{g.description}</p>
                        <div className="flex flex-wrap gap-1.5">
                          {g.skillsRequired.map((s, idx) => (
                            <span key={idx} className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded font-medium">{s}</span>
                          ))}
                        </div>
                      </div>

                      <div className="pt-4 border-t border-slate-800 flex items-center justify-between">
                        <span className="text-xs text-slate-400">{g.type} • {g.applicantsCount} Applicants</span>
                        <button
                          onClick={() => handleApplyGig(g.id)}
                          disabled={g.applied}
                          className={`px-5 py-2.5 rounded-xl text-xs font-bold ${
                            g.applied ? 'bg-slate-800 text-slate-500' : 'bg-rose-600 hover:bg-rose-700 text-white'
                          }`}
                        >
                          {g.applied ? '✓ Application Submitted' : 'Apply with Portfolio'}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: DASHBOARD */}
            {activeTab === 'profile' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                <div className="glass-card rounded-3xl p-8 flex flex-col md:flex-row items-center md:items-start gap-6">
                  <img src={user.avatar} alt={user.name} className="w-28 h-28 rounded-full border-4 border-indigo-500 shadow-2xl" />
                  <div className="space-y-3 text-center md:text-left flex-1">
                    <h1 className="text-2xl font-bold text-white">{user.name} ✓</h1>
                    <p className="text-xs text-indigo-300">{user.title} • {user.location}</p>
                    <p className="text-xs text-slate-300 max-w-xl">{user.bio}</p>
                    <div className="pt-2 flex flex-wrap gap-2">
                      {user.skills.map((s, idx) => (
                        <span key={idx} className="bg-indigo-500/20 text-indigo-300 text-xs px-3 py-1 rounded-full font-bold">✓ {s}</span>
                      ))}
                    </div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center space-y-1">
                    <span className="text-[10px] text-slate-400 uppercase font-semibold">Total Income Earned</span>
                    <p className="text-2xl font-extrabold text-emerald-400">₹{user.earnings.toLocaleString()}</p>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-400 text-center">
            <p className="font-bold text-white">NariShakti Skills • Empowering Women from Learning to Earning</p>
          </footer>

          {/* Submit Modal */}
          {isSubmitOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="glass-card rounded-3xl max-w-md w-full p-6 text-white space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold">Submit Capstone Project</h3>
                  <button onClick={() => setIsSubmitOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <input id="p-title" type="text" placeholder="Project Title" className="w-full bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs text-white" />
                <textarea id="p-desc" placeholder="Project Description" rows="3" className="w-full bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs text-white"></textarea>
                <button 
                  onClick={() => {
                    const t = document.getElementById('p-title').value || "7-Day Instagram Growth Plan";
                    const d = document.getElementById('p-desc').value || "Designed posts and story calendars for a local business.";
                    handleAddProject({ title: t, description: d, category: "Marketing", imageUrl: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&q=80&w=600", tags: ["Canva", "Marketing"] });
                    setIsSubmitOpen(false);
                  }}
                  className="w-full btn-gradient-primary py-3 rounded-xl font-bold text-xs text-white"
                >
                  Publish to Gallery & Unlock Gigs
                </button>
              </div>
            </div>
          )}

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-2xl font-bold text-xs">
              {toast.title} {toast.message}
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
