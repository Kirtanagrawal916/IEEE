<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NariShakti Skills | Skill-to-Income Platform for Women</title>
  <meta name="description" content="Empowering women across India to learn market-relevant digital skills, build verified portfolios, and earn sustainable income through micro-gigs.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          fontFamily: {
            sans: ['Outfit', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .dark body {
      background-color: #090d16;
      color: #f8fafc;
    }
    .light body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .glass-header-dark {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-header-light {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }
    .btn-gradient-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #e11d48 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body class="dark">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const initialUserData = {
      id: "u1",
      name: "Ananya Sharma",
      title: "Certified Digital Marketer & Social Strategist",
      location: "Jaipur, Rajasthan",
      bio: "Empowered through NariShakti. I help local boutiques and artisans double their online sales through high-converting Canva graphics & Instagram reels.",
      avatar: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=300",
      skills: ["Digital Marketing", "Canva Graphics", "Instagram Ads"],
      earnings: 14500,
      completedLessons: ["m1-l1", "m1-l2", "m1-l3"],
      appliedGigs: ["g1"]
    };

    const skillTracksData = [
      {
        id: "track-1",
        title: "Digital Marketing & Social Media",
        category: "Marketing",
        duration: "4.5 Hours",
        description: "Learn to manage Instagram accounts for small businesses, run local Meta ads, and design social content.",
        lessons: [
          { id: "m1-l1", title: "Lesson 1: Business Profiles on Instagram & WhatsApp", duration: "20 min", videoUrl: "https://www.youtube.com/embed/nU-IIXBWlS4", summary: "Optimize profile for local customer inquiries." },
          { id: "m1-l2", title: "Lesson 2: Designing Promo Posts using Canva", duration: "30 min", videoUrl: "https://www.youtube.com/embed/un50Bs4BvZ8", summary: "Master graphic design basics, brand colors, and fonts." },
          { id: "m1-l3", title: "Lesson 3: Writing Captions & Local Hashtags", duration: "25 min", videoUrl: "https://www.youtube.com/embed/4y_f0L6J-uQ", summary: "Craft high-converting hooks and calls-to-action." },
          { id: "m1-l4", title: "Lesson 4: Running a ₹500 Meta Local Ad", duration: "35 min", videoUrl: "https://www.youtube.com/embed/3Q95b6XmXn8", summary: "Target nearby customers for boutiques." },
          { id: "m1-l5", title: "Capstone Project: Submit 7-Day Strategy", duration: "40 min", videoUrl: "https://www.youtube.com/embed/VpXJ27p2Wlg", summary: "Create a portfolio item to unlock client gig applications." }
        ]
      }
    ];

    const initialPortfoliosData = [
      {
        id: "p1",
        authorName: "Ananya Sharma",
        authorAvatar: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=300",
        location: "Jaipur",
        category: "Marketing",
        title: "7-Day Instagram Reel & Banner Campaign for Jaipur Handloom",
        description: "Created 7 social media posts and WhatsApp inquiry links for a local textile store.",
        imageUrl: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&q=80&w=600",
        tags: ["Canva", "Instagram"],
        likes: 64
      }
    ];

    const initialGigsData = [
      {
        id: "g1",
        title: "Social Media Manager for Handcrafted Spices",
        company: "Desi Flavors India",
        logo: "https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&q=80&w=150",
        stipend: "₹8,500 / month",
        type: "Remote Part-time",
        skillsRequired: ["Digital Marketing", "Canva Graphics"],
        description: "Manage Instagram account, post 4 Canva banners per week, and handle customer DMs.",
        applied: true,
        applicantsCount: 16
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [theme, setTheme] = useState('dark');
      const [user, setUser] = useState(initialUserData);
      const [portfolios, setPortfolios] = useState(initialPortfoliosData);
      const [gigs, setGigs] = useState(initialGigsData);

      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');

      useEffect(() => {
        document.body.className = theme;
        if (window.lucide) window.lucide.createIcons();
      }, [theme, activeTab, isMenuOpen]);

      const toggleTheme = () => setTheme(theme === 'dark' ? 'light' : 'dark');

      return (
        <div className={`min-h-screen flex flex-col ${theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
          
          {/* NAVIGATION BAR */}
          <header className={`sticky top-0 z-50 ${theme === 'dark' ? 'glass-header-dark' : 'glass-header-light'}`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              {/* Logo */}
              <div onClick={() => setActiveTab('home')} className="flex items-center gap-3 cursor-pointer">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-rose-500 flex items-center justify-center text-white shadow-lg">
                  <i data-lucide="sparkles" className="w-6 h-6"></i>
                </div>
                <div>
                  <span className="text-xl font-extrabold bg-gradient-to-r from-indigo-500 via-purple-500 to-rose-500 bg-clip-text text-transparent">
                    NariShakti<span className="text-rose-500">Skills</span>
                  </span>
                  <p className="text-[11px] opacity-70 font-medium">Learn • Showcase • Earn</p>
                </div>
              </div>

              {/* Clean Direct Navigation (Overview & Dashboard) */}
              <div className="hidden md:flex items-center gap-2 p-1.5 rounded-2xl border border-slate-700/40 bg-slate-900/60">
                <button
                  onClick={() => setActiveTab('home')}
                  className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${
                    activeTab === 'home' ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Overview
                </button>
                <button
                  onClick={() => setActiveTab('profile')}
                  className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${
                    activeTab === 'profile' ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Dashboard
                </button>
              </div>

              {/* Right Section: Theme Toggle, Login/Sign Up, & 3-Dot Menu */}
              <div className="flex items-center gap-3">
                
                {/* Theme Switcher Toggle */}
                <button
                  onClick={toggleTheme}
                  className="p-2.5 rounded-xl border border-slate-700/60 bg-slate-800 text-amber-400 hover:scale-105 transition-all"
                  title="Toggle Light / Dark Mode"
                >
                  <i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4"></i>
                </button>

                {/* Login & Sign Up Buttons */}
                {user ? (
                  <div className="flex items-center gap-2">
                    <div onClick={() => setActiveTab('profile')} className="flex items-center gap-2 bg-slate-900 border border-indigo-500/30 px-3 py-1.5 rounded-xl cursor-pointer">
                      <img src={user.avatar} alt={user.name} className="w-8 h-8 rounded-full border border-indigo-400" />
                      <div className="hidden sm:block text-xs">
                        <p className="font-bold">{user.name}</p>
                        <p className="text-emerald-400 font-extrabold text-[10px]">₹{user.earnings.toLocaleString()}</p>
                      </div>
                    </div>
                    <button onClick={() => setUser(null)} className="p-2 text-slate-400 hover:text-rose-500">
                      <i data-lucide="log-out" className="w-4 h-4"></i>
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => { setAuthMode('login'); setIsAuthOpen(true); }}
                      className="px-3.5 py-2 rounded-xl text-xs font-bold border border-slate-700 hover:border-indigo-500"
                    >
                      Login
                    </button>
                    <button 
                      onClick={() => { setAuthMode('signup'); setIsAuthOpen(true); }}
                      className="btn-gradient-primary px-4 py-2 rounded-xl text-xs font-bold text-white shadow-md"
                    >
                      Sign Up
                    </button>
                  </div>
                )}

                {/* 3-DOT MENU DROPDOWN (Learn Case, Show Skill, Opportunity) */}
                <div className="relative">
                  <button
                    onClick={() => setIsMenuOpen(!isMenuOpen)}
                    className={`p-2.5 rounded-xl border transition-all ${
                      isMenuOpen || ['learn', 'portfolio', 'gigs'].includes(activeTab)
                        ? 'bg-indigo-600 text-white border-indigo-500'
                        : 'bg-slate-800 border-slate-700/60 text-slate-300'
                    }`}
                  >
                    <i data-lucide="more-vertical" className="w-5 h-5"></i>
                  </button>

                  {isMenuOpen && (
                    <div className="absolute right-0 mt-3 w-60 rounded-2xl bg-slate-900 border border-slate-700/80 shadow-2xl p-2 z-50 text-white animate-fade-in">
                      <p className="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Explore Sections</p>
                      
                      {/* Learn Case */}
                      <button
                        onClick={() => { setActiveTab('learn'); setIsMenuOpen(false); }}
                        className={`w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold flex items-center justify-between transition-colors ${
                          activeTab === 'learn' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-200'
                        }`}
                      >
                        <span className="flex items-center gap-2"><i data-lucide="book-open" className="w-4 h-4 text-indigo-400"></i> Learn Case</span>
                        <span className="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full font-extrabold">5 Lessons</span>
                      </button>

                      {/* Show Skill */}
                      <button
                        onClick={() => { setActiveTab('portfolio'); setIsMenuOpen(false); }}
                        className={`w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold flex items-center justify-between transition-colors ${
                          activeTab === 'portfolio' ? 'bg-purple-600 text-white' : 'hover:bg-slate-800 text-slate-200'
                        }`}
                      >
                        <span className="flex items-center gap-2"><i data-lucide="award" className="w-4 h-4 text-purple-400"></i> Show Skill</span>
                        <span className="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-full font-extrabold">Verified</span>
                      </button>

                      {/* Opportunity */}
                      <button
                        onClick={() => { setActiveTab('gigs'); setIsMenuOpen(false); }}
                        className={`w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold flex items-center justify-between transition-colors ${
                          activeTab === 'gigs' ? 'bg-rose-600 text-white' : 'hover:bg-slate-800 text-slate-200'
                        }`}
                      >
                        <span className="flex items-center gap-2"><i data-lucide="briefcase" className="w-4 h-4 text-rose-400"></i> Opportunity</span>
                        <span className="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-full font-extrabold">3 Gigs</span>
                      </button>
                    </div>
                  )}
                </div>

              </div>

            </div>
          </header>

          {/* MAIN PAGE CONTENTS */}
          <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            {activeTab === 'home' && (
              <div className="space-y-12 text-center md:text-left">
                <div className="max-w-3xl space-y-6">
                  <span className="px-3.5 py-1.5 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-bold uppercase tracking-wider">Skill-to-Income Platform</span>
                  <h1 className="text-4xl md:text-5xl font-extrabold leading-tight">Empowering Women from Skill Learning to Paid Work.</h1>
                  <p className="text-slate-300 text-base">Learn in-demand digital skills, publish verified portfolio proof, and get hired for paid micro-gigs.</p>
                  <div className="flex gap-4 justify-center md:justify-start">
                    <button onClick={() => setActiveTab('learn')} className="btn-gradient-primary px-6 py-3 rounded-xl font-bold text-xs text-white">Start Free Learning</button>
                    <button onClick={() => setActiveTab('gigs')} className="px-6 py-3 rounded-xl font-bold text-xs border border-slate-700 bg-slate-900 text-white">Explore Micro-Gigs</button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'learn' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold">Learn Case • Digital Marketing & Social Media</h1>
                <p className="text-xs text-slate-400">Master Canva, Instagram Reels & Meta Ads in short video lessons.</p>
              </div>
            )}

            {activeTab === 'portfolio' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold">Show Skill • Verified Portfolio Gallery</h1>
                <p className="text-xs text-slate-400">Browse real capstone projects submitted by certified women learners.</p>
              </div>
            )}

            {activeTab === 'gigs' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold">Opportunity • Paid Micro-Gigs & Internships</h1>
                <p className="text-xs text-slate-400">Apply to verified client opportunities with 1-click portfolio proof.</p>
              </div>
            )}

            {activeTab === 'profile' && user && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold">Dashboard • {user.name}</h1>
                <p className="text-xs text-emerald-400 font-bold">Total Earnings: ₹{user.earnings.toLocaleString()}</p>
              </div>
            )}
          </main>

          {/* Auth Modal */}
          {isAuthOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 text-white space-y-4">
                <h2 className="text-xl font-bold text-center">{authMode === 'login' ? 'Login to NariShakti' : 'Create Free Account'}</h2>
                <button 
                  onClick={() => { setUser(initialUserData); setIsAuthOpen(false); }}
                  className="w-full btn-gradient-primary py-3 rounded-xl font-bold text-xs"
                >
                  Continue as Ananya Sharma
                </button>
                <button onClick={() => setIsAuthOpen(false)} className="w-full text-center text-xs text-slate-400 hover:text-white">Cancel</button>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800 py-6 text-center text-xs text-slate-400">
            NariShakti Skills • Empowering Women from Skill to Income
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
