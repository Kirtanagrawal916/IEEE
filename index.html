<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HerEarn | Skill to Income Platform for Women</title>
  <meta name="description" content="Turn Skills Into Sustainable Income. Empowering women across India to learn market-relevant skills, showcase their work, and connect with real income opportunities.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cream: '#FFF9F5',
            plum: {
              50: '#FAF5FF',
              100: '#F3E8FF',
              200: '#E9D5FF',
              500: '#8B5CF6',
              600: '#7C3AED',
              700: '#6D28D9',
              800: '#5B21B6',
            },
            coral: {
              50: '#FFF7ED',
              100: '#FFEDD5',
              200: '#FED7AA',
              500: '#F97316',
              600: '#EA580C',
              700: '#C2410C',
            },
            charcoal: {
              900: '#1F2937',
              700: '#374151',
              600: '#4B5563',
              500: '#6B7280',
              300: '#D1D5DB',
              200: '#E5E7EB',
              100: '#F3F4F6',
              50: '#F9FAFB',
            },
            purpleBrand: {
              500: '#8b5cf6',
              600: '#7C3AED',
              700: '#6d28d9',
            },
            pinkBrand: {
              500: '#ec4899',
              600: '#EC4899',
            }
          },
          fontFamily: {
            heading: ['Nunito', 'Poppins', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(124, 58, 237, 0.07), 0 2px 6px -1px rgba(0, 0, 0, 0.04)',
            'card': '0 10px 30px -5px rgba(31, 41, 55, 0.06), 0 4px 12px -2px rgba(31, 41, 55, 0.03)',
            'card-hover': '0 20px 40px -8px rgba(124, 58, 237, 0.12), 0 6px 16px -3px rgba(31, 41, 55, 0.06)',
          },
          borderRadius: {
            'card': '16px',
            'btn': '12px',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Nunito, Poppins, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="light bg-[#FFF9F5] dark:bg-[#0F0918] text-[#1F2937] dark:text-white min-h-screen font-sans antialiased transition-colors duration-300">
  <div id="root"></div>
  <!-- Google Identity Services (OAuth 2.0 Sign-In) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Google Translate Engine for Full Page Translation across every page -->
  <div id="google_translate_element" style="display:none;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,mr,bn,ta,te,gu,kn,ml,pa',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
